<!DOCTYPE html>

	<link rel="stylesheet" href="/fontawesome/css/all.min.css">
	<style>
		/* full size graph: scroll inside the view when it is wider than the screen */
		.modal-content {
			width: fit-content;
			max-width: calc(100vw - 40px);
			overflow: auto;
		}
		#modal-of-image {
			width: auto;
			max-width: none;
		}
		/* buttons in the settings bar look like the former links */
		.navbar button.navbar-link,
		.navbar button.navbar-item,
		.navbar button.navbar-burger {
			background-color: transparent;
			border: 0;
			font: inherit;
			cursor: pointer;
		}
		.navbar button.navbar-link,
		.navbar .navbar-dropdown button.navbar-item {
			width: 100%;
			text-align: left;
		}
		/* section headings: white on a darker teal for a 4.5:1 contrast */
		.notification.graph-heading {
			background-color: #00796b;
			color: #fff;
		}
		.notification.graph-heading .title,
		.notification.graph-heading .subtitle {
			color: #fff;
		}
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}
		/* keyboard: closed dropdowns stay closed while their button has the focus */
		.navbar-item.is-hoverable:focus-within:not(:hover):not(.is-active) .navbar-dropdown {
			display: none;
		}
		.navbar button:focus-visible {
			outline: 3px solid #485fc7;
			outline-offset: -3px;
		}
	</style>
</head>
